<div class="user-grid-container">
  <div class="header">
    <h1>User Management</h1>
    <button mat-raised-button color="primary" (click)="onCreate()">Add New User</button>
  </div>

  <div class="grid-wrapper">
    <ag-grid-angular
      style="width: 100%; height: 600px;"
      class="ag-theme-quartz"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="10"
      [domLayout]="'autoHeight'"
      (cellClicked)="onCellClicked($event)">
    </ag-grid-angular>
  </div>

  <div class="dialog-overlay" *ngIf="isDialogOpen" (click)="closeDialog()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <h2>{{ editingUser?.id ? 'Edit User' : 'New User' }}</h2>

      <div class="form-group">
        <label>Name:</label>
        <input type="text" [(ngModel)]="editingUser!.name" placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="editingUser!.email" placeholder="Enter email">
      </div>

      <div class="form-group">
        <label>Phone:</label>
        <input type="text" [(ngModel)]="editingUser!.phone" placeholder="Enter phone">
      </div>

      <div class="form-group">
        <label>Address:</label>
        <input type="text" [(ngModel)]="editingUser!.address" placeholder="Enter address">
      </div>

      <div class="form-group">
        <label>Status:</label>
        <select [(ngModel)]="editingUser!.status">
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
          <option value="PENDING">Pending</option>
        </select>
      </div>

      <div class="dialog-actions">
        <button mat-raised-button color="primary" (click)="onSave()">Save</button>
        <button mat-raised-button (click)="closeDialog()">Cancel</button>
      </div>
    </div>
  </div>
</div>
